name: Publish GISTable WebGIS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gistable-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check customer-facing copy
        working-directory: frontend
        run: npm run check:ui
      - name: Install Vue type checker
        working-directory: frontend
        run: npm install --no-save --package-lock=false --no-audit --no-fund vue-tsc@3.3.14
      - name: Strict Vue and TypeScript validation
        working-directory: frontend
        run: npx --no-install vue-tsc --noEmit -p tsconfig.json
      - name: GeoJSON security and regression unit tests
        working-directory: frontend
        run: node --experimental-strip-types --test scripts/geojson-validation.test.mjs
      - name: Build WebGIS
        working-directory: frontend
        env:
          VITE_BASE_PATH: /GISTable/
          VITE_ROUTER_MODE: hash
          VITE_DATA_SOURCE: static
        run: npm run build
      - name: Verify deploy artifact
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/sample-data/objects.geojson
          grep -q '/GISTable/assets/' frontend/dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check public page, bundle and GeoJSON response
        run: |
          set -euo pipefail
          SITE='https://ktimxfgit.github.io/GISTable/'
          curl -fLsS --retry 12 --retry-delay 5 --retry-all-errors "$SITE" -o /tmp/gistable.html
          grep -q 'GISTable' /tmp/gistable.html
          JS_PATH=$(grep -oE 'src="/GISTable/assets/[^"]+\.js"' /tmp/gistable.html | head -n 1 | cut -d '"' -f 2)
          test -n "$JS_PATH"
          curl -fLsS "https://ktimxfgit.github.io$JS_PATH" -o /tmp/gistable.js
          test -s /tmp/gistable.js
          curl -fLsS --retry 5 --retry-delay 2 "$SITE"'sample-data/objects.geojson' -o /tmp/gistable-objects.geojson
          grep -q 'FeatureCollection' /tmp/gistable-objects.geojson
          echo 'Live GISTable entry, JavaScript bundle and spatial data: HTTP 200'

  browser:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked project dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install browser test runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.58.2
      - name: Verify GIS interaction in Chromium
        working-directory: frontend
        run: node scripts/browser-smoke.mjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gistable-browser-failure
          path: frontend/browser-smoke-failure.png
          if-no-files-found: ignore
