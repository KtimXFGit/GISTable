name: Publish GISTable WebGIS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gistable-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Check customer-facing copy
        working-directory: frontend
        run: npm run check:ui
      - name: Build WebGIS
        working-directory: frontend
        env:
          VITE_BASE_PATH: /GISTable/
          VITE_ROUTER_MODE: hash
          VITE_DATA_SOURCE: static
        run: npm run build
      - name: Verify deploy artifact
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/sample-data/objects.geojson
          grep -q '/GISTable/assets/' frontend/dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
