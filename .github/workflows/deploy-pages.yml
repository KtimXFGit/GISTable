name: Publish GISTable WebGIS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gistable-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check customer-facing copy
        working-directory: frontend
        run: npm run check:ui
      - name: Build WebGIS
        working-directory: frontend
        env:
          VITE_BASE_PATH: /GISTable/
          VITE_ROUTER_MODE: hash
          VITE_DATA_SOURCE: static
        run: npm run build
      - name: Verify deploy artifact
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/sample-data/objects.geojson
          grep -q '/GISTable/assets/' frontend/dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check public page, bundle and GeoJSON response
        run: |
          set -euo pipefail
          SITE='https://ktimxfgit.github.io/GISTable/'
          curl -fLsS --retry 12 --retry-delay 5 --retry-all-errors "$SITE" -o /tmp/gistable.html
          grep -q 'GISTable' /tmp/gistable.html
          JS_PATH=$(grep -oE 'src="/GISTable/assets/[^"]+\.js"' /tmp/gistable.html | head -n 1 | cut -d '"' -f 2)
          test -n "$JS_PATH"
          curl -fLsS "https://ktimxfgit.github.io$JS_PATH" -o /tmp/gistable.js
          test -s /tmp/gistable.js
          curl -fLsS "$SITE"'sample-data/objects.geojson' | grep -q 'FeatureCollection'
          echo 'Live GISTable entry, JavaScript bundle and spatial data: HTTP 200'
